name: Release
# Push a tag that matches package.json (for example v0.4.0) to publish the
# package to npm with provenance and create the matching GitHub release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.4.0)
        required: true
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing and provenance
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
      - name: Pack the reviewed archive
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          echo "ARCHIVE=$RUNNER_TEMP/wearer-haitch-agent-relay-$VERSION.tgz" >> "$GITHUB_ENV"
      - name: Skip versions that are already published
        id: published
        run: |
          if npm view "@wearer-haitch/agent-relay@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        # Uses npm trusted publishing when configured on npmjs.com; otherwise
        # falls back to the NPM_TOKEN repository secret.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$ARCHIVE" --access public --provenance
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --title "$TAG" --generate-notes --verify-tag
          fi
