name: Surveillance
# Watches the deployed surfaces. It runs on a schedule, on demand, and after every
# Cloudflare deploy, and it runs in parallel with the deploy workflow rather than
# after it: a broken page is reported even if the deploy itself hangs.
#
# What it checks:
#   - every public page answers 200 and carries its SEO metadata
#   - robots.txt, the sitemap and the icons are there
#   - a missing path answers 404 with the styled page, not a server error
#   - the npm package and the published GitHub release are the same version
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: 'Site origin to watch (defaults to the package homepage)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['site/**', 'package.json', 'scripts/surveillance.mjs']
concurrency:
  group: surveillance
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Watch the live surfaces
        env:
          ORIGIN: ${{ inputs.origin }}
        run: node scripts/surveillance.mjs
