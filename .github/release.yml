changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Dashboard
      labels: [dashboard]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies and automation
      labels: [dependencies, github_actions]
    - title: Other changes
      labels: ['*']
